name: Feature request
description: Suggest a change that is not a bug
title: ""
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today, in concrete terms
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you suggest
      description: The smallest change that would solve it
  - type: textarea
    id: scope
    attributes:
      label: Compatibility
      description: |
        Name your session, compositor and UI scale. The supported setup is a KDE Plasma Wayland session with the English UI at 100%. See https://github.com/coruscnium/CoruFrame/blob/main/docs/wiki/Compatibility.md before assuming a different setup is supported.
