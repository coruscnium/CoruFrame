name: Bug report
description: Something does not work; include doctor output and a log tail
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Run `coruframe doctor` first and paste its output below. **Do not paste a market token, a wallet entry, or a screenshot that shows another player's name.** If the issue is a security problem, use a private advisory instead of this form.
  - type: input
    id: version
    attributes:
      label: CoruFrame version
      description: The release tag or `coruframe --version`
    validations:
      required: true
  - type: input
    id: session
    attributes:
      label: Session and compositor
      placeholder: KDE Plasma 6.2 Wayland, 3440x1440 at 100% scale
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: coruframe doctor
      description: Paste the full output
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        HUD probe: `~/.cache/coruframe/probe.log`. OCR: `~/.cache/coruframe/ocr.log`. Settings → Reward HUD → Show log also shows the probe tail. Trim anything identifying before pasting.
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reward HUD / OCR
        - Inventory snapshot
        - Desktop app
        - warframe.market account
        - Item database / relic planner
        - Build or packaging
        - Other
    validations:
      required: true
