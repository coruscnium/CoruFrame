version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # zbus 6 dropped the blocking API the CLI is built on.
      - dependency-name: "zbus"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      app-rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns: ["*"]
    ignore:
      # vue-tsc 3.3.x cannot load the TypeScript 7 native compiler.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

# Dependabot has no Nix ecosystem. `flake.lock` is updated by hand with
# `nix flake update`, reviewed like any other dependency change.
